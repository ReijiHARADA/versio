<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title desc"><title id="title">Current MADLAD translation audit: automatic outcomes</title><desc id="desc">4 stratified papers × 3 extracted units. These are production quality-gate outcomes, not semantic accuracy.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px;fill:#506273}.label{font-size:16px}.tick{font-size:13px;fill:#506273}.value{font-size:15px;font-weight:600}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="44" class="title">Current MADLAD translation audit: automatic outcomes</text><text x="40" y="72" class="subtitle">4 stratified papers × 3 extracted units. These are production quality-gate outcomes, not semantic accuracy.</text><line x1="280" y1="96" x2="280" y2="430" stroke="#d9e0e8"/><text x="280" y="88" text-anchor="middle" class="tick">0%</text><line x1="430" y1="96" x2="430" y2="430" stroke="#d9e0e8"/><text x="430" y="88" text-anchor="middle" class="tick">25%</text><line x1="580" y1="96" x2="580" y2="430" stroke="#d9e0e8"/><text x="580" y="88" text-anchor="middle" class="tick">50%</text><line x1="730" y1="96" x2="730" y2="430" stroke="#d9e0e8"/><text x="730" y="88" text-anchor="middle" class="tick">75%</text><line x1="880" y1="96" x2="880" y2="430" stroke="#d9e0e8"/><text x="880" y="88" text-anchor="middle" class="tick">100%</text><text x="262" y="145" text-anchor="end" class="label">Fully translated accepted</text><rect x="280" y="120" width="300" height="32" rx="5" fill="#2463a6"/><text x="590" y="143" class="value">6/12 (50.0%)</text><text x="262" y="217" text-anchor="end" class="label">Reader-visible source fallback</text><rect x="280" y="192" width="300" height="32" rx="5" fill="#b24a3b"/><text x="590" y="215" class="value">6/12 (50.0%)</text><text x="262" y="28