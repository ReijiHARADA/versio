<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title desc"><title id="title">Actual extraction + EPUB export time by PDF length</title><desc id="desc">Successful all-corpus runs. Bars show median wall time per paper; this benchmark did not profile CPU or peak memory.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px;fill:#506273}.label{font-size:16px}.tick{font-size:13px;fill:#506273}.value{font-size:15px;font-weight:600}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="44" class="title">Actual extraction + EPUB export time by PDF length</text><text x="40" y="72" class="subtitle">Successful all-corpus runs. Bars show median wall time per paper; this benchmark did not profile CPU or peak memory.</text><line x1="280" y1="96" x2="280" y2="430" stroke="#d9e0e8"/><text x="280" y="88" text-anchor="middle" class="tick">0.0 s</text><line x1="430" y1="96" x2="430" y2="430" stroke="#d9e0e8"/><text x="430" y="88" text-anchor="middle" class="tick">0.8 s</text><line x1="580" y1="96" x2="580" y2="430" stroke="#d9e0e8"/><text x="580" y="88" text-anchor="middle" class="tick">1.5 s</text><line x1="730" y1="96" x2="730" y2="430" stroke="#d9e0e8"/><text x="730" y="88" text-anchor="middle" class="tick">2.3 s</text><line x1="880" y1="96" x2="880" y2="430" stroke="#d9e0e8"/><text x="880" y="88" text-anchor="middle" class="tick">3.0 s</text><text x="262" y="145" text-anchor="end" class="label">1–5 pages (n=113)</text><rect x="280" y="120" width="55.163290615957" height="32" rx="5" fill="#6d4c9b"/><text x="345.163290615957" y="143" class="value">0.28 s median</text><text x="262" y="217" text-anchor="end" class="label">6–15 pages (n=673)</text><rect x="280" y="192" width="204.77883422902025" height="32" rx="5" fill="#6d4c9b"/><text x="494.7788342290203" y="215" class="value">1.03 s median</text><text x="262" y="289" text-anchor="end" class="label">16–30 pages (n=556)</text><rect x="280" y="264" width="369.3757751136833" height="32" rx="5" fill="#6d4c9b"/><text x="659.3757751136833" y="287" class="value">1.86 s median</text><text x="262" y="361" text-anchor="end" class="label">31+ pages (n=81)</text><rect x="280" y="336" width="479.99999999999994" height="32" rx="5" fill="#6d4c9b"/><text x="770" y="359" class="value">2.42 s median</text></svg>