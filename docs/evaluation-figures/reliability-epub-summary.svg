<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="406" viewBox="0 0 1000 406" role="img" aria-labelledby="title desc"><title id="title">Mobile EPUB conversion and capacity reduction</title><desc id="desc">All 1,432 de-duplicated local PDFs; raw source PDF compared with actual .epub ZIP output.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px;fill:#506273}.label{font-size:16px}.tick{font-size:13px;fill:#506273}.value{font-size:15px;font-weight:600}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="44" class="title">Mobile EPUB conversion and capacity reduction</text><text x="40" y="72" class="subtitle">All 1,432 de-duplicated local PDFs; raw source PDF compared with actual .epub ZIP output.</text><line x1="280" y1="96" x2="280" y2="358" stroke="#d9e0e8"/><text x="280" y="88" text-anchor="middle" class="tick">0%</text><line x1="430" y1="96" x2="430" y2="358" stroke="#d9e0e8"/><text x="430" y="88" text-anchor="middle" class="tick">25%</text><line x1="580" y1="96" x2="580" y2="358" stroke="#d9e0e8"/><text x="580" y="88" text-anchor="middle" class="tick">50%</text><line x1="730" y1="96" x2="730" y2="358" stroke="#d9e0e8"/><text x="730" y="88" text-anchor="middle" class="tick">75%</text><line x1="880" y1="96" x2="880" y2="358" stroke="#d9e0e8"/><text x="880" y="88" text-anchor="middle" class="tick">100%</text><text x="262" y="145" text-anchor="end" class="label">Conversion success</text><rect x="280" y="120" width="596.2290502793296" height="32" rx="5" fill="#2463a6"/><text x="886.2290502793296" y="143" class="value">1423/1432 (99.4%)</text><text x="262" y="217" text-anchor="end" class="label">Total capacity reduction</text><rect x="280" y="192" width="368.04328691322974" height="32" rx="5" fill="#2463a6"/><text x="658.0432869132297" y="215" class="value">61.3% (3075.84 → 1189.10 MiB)</text><text x="262" y="289" text-anchor="end" class="label">Median per-paper reduction</text><rect x="280" y="264" width="370.4622327459775" height="32" rx="5" fill="#2463a6"/><text x="660.4622327459774" y="287" class="value">61.7%</text></svg>