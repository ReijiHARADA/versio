name: CI

# PR / push gate (no MADLAD, no release packaging).
# Nightly / packaged acceptance lives in release-acceptance.yml.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  typescript:
    name: TypeScript test / lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser smoke (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 5173 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "preview ready"
              break
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              echo "preview process exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ >/dev/null
          PAPER_READER_URL=http://127.0.0.1:5173 npm run verify:browser

  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          # Tauri v2 prerequisites (WebKitGTK 4.1 / GTK / appindicator / rsvg)
          # https://v2.tauri.app/start/prerequisites/
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    name: Lightweight Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translation-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Run unit tests (no MADLAD / torch)
        run: |
          python -m unittest tests.test_citation_protect -v
        env:
          SKIP_MODEL_DOWNLOAD: "1"
