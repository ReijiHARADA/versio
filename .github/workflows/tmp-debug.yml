name: tmp-debug
on:
  push:
    branches: [fix/llama-ci-build]
jobs:
  d:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: bash -x scripts/tauri-build.sh clean 2>&1 | head -40 || true
      - run: ls -la ~/.cargo/env /Applications | head -20; echo DEVELOPER_DIR=$DEVELOPER_DIR; xcode-select -p
