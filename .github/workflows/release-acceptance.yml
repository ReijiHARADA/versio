# Reminder + optional macOS gate for packaged .app acceptance.
# Full MADLAD download stays out of PR CI — use nightly or manual runs.

name: Release acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

jobs:
  macos-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Automated pre-release gates
        run: npm run release:acceptance
      - name: Packaged app build (clean, no MADLAD)
        run: npm run tauri:build:clean
      - name: Acceptance checklist
        run: cat docs/RELEASE_ACCEPTANCE.md
