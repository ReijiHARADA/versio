# Reminder + optional macOS gate for packaged .app acceptance.

name: Release acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

jobs:
  macos-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Build llama-server sidecar
        run: npm run build:llama-server
      - name: Automated pre-release gates
        run: npm run release:acceptance
      - name: Packaged app build
        run: npm run tauri:build:clean
      - name: Packaged integration E2E (Layer A)
        run: npm run packaged:e2e:integration
      - name: Packaged UI E2E (Layer B)
        run: npm run packaged:e2e:ui
      - name: Signing status
        run: |
          if [ "${{ secrets.APPLE_SIGNING_IDENTITY }}" != "" ]; then
            echo "Apple secrets present in repo settings — run signed flow manually or extend this job."
            echo "This scheduled job remains unsigned unless VERSIO_SIGN is wired with a keychain."
            echo "signed acceptance not executed"
          else
            echo "unsigned acceptance passed"
            echo "signed acceptance not executed"
          fi
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-e2e-artifacts
          path: scripts/packaged-e2e/artifacts/
          if-no-files-found: ignore
      - name: Manual checklist remainder
        run: cat docs/RELEASE_ACCEPTANCE.md
      - name: Signing docs reminder
        run: cat docs/MACOS_RELEASE.md
