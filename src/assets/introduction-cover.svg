<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" width="360" height="468">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceef1"/>
      <stop offset="0.4" stop-color="#a3a9b0"/>
      <stop offset="1" stop-color="#5a6068"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="360" height="468" fill="#fff"/>

  <!-- the app icon's staple, seen through the sheet: two legs with a gap where it pierces the paper -->
  <g transform="translate(180 176) rotate(-45)">
    <g fill="#000" opacity="0.16" filter="url(#soft)" transform="translate(3 5)">
      <rect x="-68" y="-5" width="62" height="10" rx="5"/>
      <rect x="6" y="-5" width="62" height="10" rx="5"/>
    </g>
    <rect x="-68" y="-5" width="62" height="10" rx="5" fill="url(#steel)"/>
    <rect x="6" y="-5" width="62" height="10" rx="5" fill="url(#steel)"/>
  </g>

  <g font-family="'Iowan Old Style', 'Palatino', 'Times New Roman', serif" fill="#1d1f23" text-anchor="middle">
    <text x="180" y="300" font-size="23" font-weight="600">Versio: Reading Papers</text>
    <text x="180" y="328" font-size="23" font-weight="600">Across Languages</text>
  </g>
  <text x="180" y="358" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'YuMincho', serif" font-size="14.5" fill="#3d4148">言語を越えて論文を読む</text>
  <text x="180" y="392" text-anchor="middle" font-family="'Iowan Old Style', 'Palatino', serif" font-size="10.5" font-style="italic" fill="#6a6f76">The Versio Team</text>
</svg>
